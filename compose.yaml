name: personalfin

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: personalfin
      POSTGRES_PASSWORD: personalfin
      POSTGRES_DB: personalfin_dev
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personalfin -d personalfin_dev']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
