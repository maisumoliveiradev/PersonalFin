    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getComparison
      summary: Compare a month with the previous month and the same month a year earlier (M-010)
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/analytics/breakdown:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getBreakdown
      summary: Realized expenses of a month range by category and tag (M-011, M-012)
      parameters:
        - name: fromMonth
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: months
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 3
              - 6
              - 12
            default: 1
      responses:
        '200':
          description: >
            Categories add up exactly to totalMinor. A transaction counts in
            full under each of its tags, so tag amounts may add up to more
            than totalMinor (DR-013). Items include those with an amount only
            in the previous range of equal length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Breakdown'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/dashboard-preferences:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getDashboardPreferences
      summary: The current user's dashboard preferences for the space
      description: Defaults to the advanced profile without overrides (isDefault true).
      responses:
        '200':
          description: Preferences and the resolved section visibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPreferences'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    put:
      operationId: saveDashboardPreferences
      summary: Save the experience profile and section overrides
      description: >
        Overrides equal to the profile default are dropped. Preferences
        only change visibility for this user; values are never affected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - profile
                - overrides
              properties:
                profile:
                  $ref: '#/components/schemas/ExperienceProfile'
                overrides:
                  $ref: '#/components/schemas/SectionOverrides'
      responses:
        '200':
          description: The saved preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardPreferences'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listInvitations
      summary: Invitations of the space, newest first (requires manage_members)
      responses:
        '200':
          description: Invitations with their status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: createInvitation
      summary: Invite a person by email with a preset or a permission set
      description: >
        Returns a single-use token once; only its hash is stored. The link
        expires after 7 days. Email delivery is not implemented yet
        (TD-011): the inviter shares the link. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                preset:
                  type: string
                  enum:
                    - viewer
                    - contributor
                    - administrator
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/SpacePermission'
      responses:
        '201':
          description: The invitation and its token (shown only now).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '409':
          description: ALREADY_MEMBER or INVITATION_PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
