openapi: 3.1.0
info:
  title: PersonalFin Application API
  version: 0.0.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API liveness
      security: []
      responses:
        '200':
          description: The API process is running and able to serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
