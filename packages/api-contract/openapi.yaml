      additionalProperties: false
      required:
        - version
        - fromOccurrenceDate
      properties:
        version:
          type: integer
          minimum: 1
        fromOccurrenceDate:
          $ref: '#/components/schemas/FinancialDate'
        description:
          type: string
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        categoryId:
          type: string
          format: uuid
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
    RecurrenceSeriesChanged:
      type: object
      additionalProperties: false
      required:
        - series
        - occurrencesAffected
      properties:
        series:
          $ref: '#/components/schemas/RecurrenceSeries'
        occurrencesAffected:
          type: integer
          minimum: 0
    RecurrenceSeriesList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecurrenceSeries'
    FlowTotals:
      type: object
      additionalProperties: false
      required:
        - income
        - expenses
      properties:
        income:
          type: integer
        expenses:
          type: integer
    Projection:
      type: object
      additionalProperties: false
      description: >
        M-008. amountMinor = base.amountMinor + (afterObservation.income -
        afterObservation.expenses) + (pendingUpToObservation.income -
        pendingUpToObservation.expenses) - openInvoices - invoicePayments.
        Card purchases enter only through their invoices. A calculation, never an observed
        balance.
      required:
        - amountMinor
        - base
        - afterObservation
        - pendingUpToObservation
        - openInvoices
        - invoicePayments
      properties:
        amountMinor:
          type: integer
        base:
          type: object
          additionalProperties: false
          required:
            - amountMinor
            - observedOn
          properties:
            amountMinor:
              type: integer
            observedOn:
              $ref: '#/components/schemas/FinancialDate'
        afterObservation:
          $ref: '#/components/schemas/FlowTotals'
        pendingUpToObservation:
          $ref: '#/components/schemas/FlowTotals'
        openInvoices:
          type: integer
          description: >
            Amount of card invoices due before the end of the month not
            covered by payments dated before the end of the month.
        invoicePayments:
          type: integer
          description: Invoice payments dated after the observation and before the end of the month.
    ProjectionSeries:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - month
              - projectedBalance
            properties:
              month:
                type: string
              projectedBalance:
                type:
                  - integer
                  - 'null'
    CommitmentSection:
      type: object
      additionalProperties: false
      required:
        - items
        - invoices
        - hasMore
        - income
        - expenses
      properties:
        items:
          type: array
          description: Pending transactions other than card purchases.
          items:
            $ref: '#/components/schemas/Transaction'
        invoices:
          type: array
          description: Open card invoices due in the section, by due date.
          items:
            $ref: '#/components/schemas/CommitmentInvoice'
        hasMore:
          type: boolean
        income:
          type: integer
          description: Sum of pending income in the section, minor units.
        expenses:
          type: integer
          description: Sum of pending expenses and open invoices in the section, minor units.
    Commitments:
      type: object
      additionalProperties: false
      required:
        - from
        - through
        - overdue
        - upcoming
      properties:
        from:
          $ref: '#/components/schemas/FinancialDate'
        through:
          $ref: '#/components/schemas/FinancialDate'
        overdue:
          $ref: '#/components/schemas/CommitmentSection'
        upcoming:
          $ref: '#/components/schemas/CommitmentSection'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable description; not localized.
