        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: FINANCIAL_SPACE_NOT_FOUND or INVITATION_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: INVITATION_NOT_AVAILABLE (already accepted or cancelled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: previewInvitation
      summary: What an invitation link grants (any signed-in user holding the token)
      responses:
        '200':
          description: The invitation preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '404':
          description: INVITATION_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: acceptInvitation
      summary: Accept an invitation with the signed-in account of the invited email
      responses:
        '200':
          description: The joined space.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - spaceId
                properties:
                  spaceId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          description: INVITATION_EMAIL_MISMATCH.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: INVITATION_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALREADY_MEMBER.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: INVITATION_NOT_AVAILABLE (expired, cancelled, or used).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/members:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listMembers
      summary: The Owner and active members of the space
      responses:
        '200':
          description: Owner first, then members by joining date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: changeMemberPermissions
      summary: Replace a member's permissions (view is always kept)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - version
                - permissions
              properties:
                version:
                  type: integer
                  minimum: 1
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/SpacePermission'
      responses:
        '204':
          description: Changed; audited.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: FINANCIAL_SPACE_NOT_FOUND or MEMBER_NOT_FOUND (including the Owner).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: VERSION_CONFLICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeMember
      summary: Remove a member; records they created stay in the space
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Removed; audited.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: FINANCIAL_SPACE_NOT_FOUND or MEMBER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: VERSION_CONFLICT or OWNER_CANNOT_LEAVE (the Owner cannot be removed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/leave:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      operationId: leaveSpace
      summary: Leave a shared space (members only)
      responses:
        '204':
          description: Left; audited.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '409':
          description: OWNER_CANNOT_LEAVE (transfer ownership first, DR-009).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/ownership-transfer:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      operationId: transferOwnership
      summary: Transfer ownership to an active member (Owner only)
      description: >
        The new Owner's membership ends and they hold every permission as
        Owner; the previous Owner becomes an Administrator member. Exactly
        one Owner before and after (DR-006). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - newOwnerUserId
              properties:
                newOwnerUserId:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Transferred.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: FINANCIAL_SPACE_NOT_FOUND or MEMBER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: VERSION_CONFLICT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/audit-events:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listAuditEvents
      summary: Audit history of the space, newest first (requires view_audit)
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditHistory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
components:
  parameters:
    InvoiceMonth:
      name: month
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: personalfin.session_token
      description: >
        Session cookie issued by Better Auth. Native clients send the same
        cookie through the Cookie header.
  responses:
    ClientUpgradeRequired:
      description: >
        The X-Client-Version header is missing, invalid, or lower than the
        configured minimum client version (code CLIENT_UPGRADE_REQUIRED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TagNotFound:
      description: The tag does not exist in this space (code TAG_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TagConflict:
      description: VERSION_CONFLICT, TAG_NAME_TAKEN, or TAG_IN_USE (archive instead).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransactionRejected:
      description: >
        CATEGORY_NOT_AVAILABLE (category not usable for the type),
        TAG_NOT_AVAILABLE (tag missing or archived),
        CARD_NOT_AVAILABLE (missing or archived card), or
        INVALID_CARD_PURCHASE (income, status sent, invoice out of range, or
        invoice change on a non-card transaction).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardNotFound:
      description: The card does not exist in this space (code CARD_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardConflict:
      description: VERSION_CONFLICT or CARD_NAME_TAKEN (another card of the space has the name).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RecurrenceNotFound:
      description: The series does not exist in this space (code RECURRENCE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotFound:
      description: The category does not exist in this space (code CATEGORY_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryConflict:
      description: >
        VERSION_CONFLICT, CATEGORY_NAME_TAKEN (sibling with the same name),
        CATEGORY_IN_USE (used by transactions, including deleted ones;
        archive instead), or CATEGORY_HAS_SUBCATEGORIES.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotAvailable:
      description: >
        The category is not a top-level category of this space with the
        same kind as the transaction type, or the subcategory does not
        belong to it (code CATEGORY_NOT_AVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransactionNotFound:
      description: The transaction does not exist in this space (code TRANSACTION_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StateConflict:
      description: >
        The request conflicts with the record's current state: the version
        is outdated (VERSION_CONFLICT), the transaction is deleted and cannot
        be edited (TRANSACTION_DELETED), or it is already deleted / not
        deleted (TRANSACTION_ALREADY_DELETED, TRANSACTION_NOT_DELETED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: The request is invalid (code VALIDATION_FAILED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FinancialSpaceNotFound:
      description: >
        The Financial Space does not exist or is not accessible to the user
        (code FINANCIAL_SPACE_NOT_FOUND). Both cases return 404 so that
        inaccessible spaces are not revealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PermissionDenied:
      description: >
        The user is a member of the space but lacks the permission for this
        action (code PERMISSION_DENIED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CardDay:
      type: integer
      minimum: 1
      maximum: 31
      description: Day of the month; months without it use their last day.
    CardName:
      type: string
      minLength: 1
      maxLength: 60
    CardLimitChange:
      type: object
      additionalProperties: false
      required:
        - id
        - amountMinor
        - currency
        - effectiveFrom
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
        recordedAt:
          type: string
          format: date-time
    Card:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - closingDay
        - dueDay
        - archived
        - version
        - limits
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        limits:
          type: array
          description: Limit history, latest effective date first (ties, latest recorded first).
          items:
            $ref: '#/components/schemas/CardLimitChange'
    CardList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    CreateCardRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - closingDay
        - dueDay
        - limitMinor
        - limitEffectiveFrom
      properties:
        name:
          $ref: '#/components/schemas/CardName'
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        limitMinor:
          $ref: '#/components/schemas/AmountMinor'
        limitEffectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
    UpdateCardRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/CardName'
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        archived:
          type: boolean
    RecordCardLimitRequest:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - effectiveFrom
      properties:
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        effectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    CreateFinancialSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Trimmed, internal whitespace collapsed; 1 to 80 characters.
          minLength: 1
          maxLength: 80
    FinancialSpace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - lifecycleState
        - role
        - permissions
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lifecycleState:
          type: string
          enum:
            - active
        role:
          type: string
          description: The requesting user's role in the space.
          enum:
            - owner
            - member
        permissions:
          type: array
          description: >
            The requesting user's permissions (ADR-0015). The Owner has all
            of them.
          items:
            $ref: '#/components/schemas/SpacePermission'
        createdAt:
          type: string
          format: date-time
    SpacePermission:
      type: string
      enum:
        - view
        - record
        - plan
        - classify
        - manage_members
        - view_audit
    AuditHistory:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - occurredAt
              - actorName
              - entityType
              - entityId
              - action
              - changes
              - context
            properties:
              context:
                description: >
                  How the change reached the server when it resolved an offline
                  synchronization conflict (ADR-0016); null otherwise.
                oneOf:
                  - type: 'null'
                  - type: object
                    additionalProperties: false
                    required:
                      - source
                      - resolution
                      - baseVersion
                    properties:
                      source:
                        type: string
                        enum:
                          - offline_sync
                      resolution:
                        $ref: '#/components/schemas/SyncResolution'
                      baseVersion:
                        type: integer
                        minimum: 1
              id:
                type: string
              occurredAt:
                type: string
                format: date-time
              actorName:
                type: string
              entityType:
                type: string
                enum:
                  - financial_transaction
                  - category
                  - recurrence_series
                  - card
                  - card_invoice
                  - card_invoice_payment
                  - tag
                  - financial_space
                  - financial_space_member
                  - space_invitation
              entityId:
                type: string
              action:
                type: string
                enum:
                  - create
                  - update
                  - delete
                  - restore
              changes:
                type: object
                description: Field name to its value before and after.
                additionalProperties:
                  type: object
                  additionalProperties: false
                  required:
                    - before
                    - after
                  properties:
                    before:
                      type:
                        - string
                        - number
                        - boolean
                        - 'null'
                    after:
                      type:
                        - string
                        - number
                        - boolean
                        - 'null'
        nextCursor:
          type:
            - string
            - 'null'
    Member:
      type: object
      additionalProperties: false
      required:
        - userId
        - name
        - email
        - role
        - permissions
        - version
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermission'
        version:
          type:
            - integer
            - 'null'
          description: Membership version; null for the Owner.
    MemberList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - cancelled
        - expired
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - permissions
        - status
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermission'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    InvitationList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    CreatedInvitation:
      type: object
      additionalProperties: false
      required:
        - invitation
        - token
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: Single-use secret for the invitation link; never returned again.
    InvitationPreview:
      type: object
      additionalProperties: false
      required:
        - spaceName
        - email
        - permissions
        - status
        - expiresAt
      properties:
        spaceName:
          type: string
        email:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermission'
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expiresAt:
          type: string
          format: date-time
    FinancialSpaceList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinancialSpace'
    CategoryKind:
      type: string
      description: Transaction type a category applies to.
      enum:
        - expense
        - income
    Subcategory:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - archived
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
    CategoryTreeItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - archived
        - version
        - subcategories
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        archived:
          type: boolean
          description: Archived categories are kept on existing transactions but not offered for new ones.
        version:
          type: integer
          minimum: 1
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - parentCategoryId
        - archived
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        parentCategoryId:
          type:
            - string
            - 'null'
          format: uuid
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          allOf:
            - $ref: '#/components/schemas/CategoryKind'
          description: Required for top-level categories; subcategories inherit the parent kind.
        parentCategoryId:
          type:
            - string
            - 'null'
          format: uuid
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 60
        archived:
          type: boolean
    CategoryList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeItem'
    TransactionType:
      type: string
      enum:
        - expense
        - income
    TransactionStatus:
      type: string
      description: paid means Paid (expense) or Received (income).
      enum:
        - paid
        - pending
    AmountMinor:
      type: integer
      description: >
        Amount in the currency's minor units (for BRL, centavos). Always
        positive; the transaction type carries the direction.
      minimum: 1
      maximum: 99999999999
    FinancialDate:
      type: string
      format: date
      description: Calendar date without time or timezone (YYYY-MM-DD).
    CategoryReference:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - description
        - amountMinor
        - financialDate
        - categoryId
      properties:
        id:
          type: string
          format: uuid
          description: >
            Optional client-generated id (UUID) so a request can be
            retried safely, for example after an offline period. Not
            allowed with installments.
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          allOf:
            - $ref: '#/components/schemas/TransactionStatus'
          description: Defaults to paid.
        description:
          type: string
          description: Trimmed, internal whitespace collapsed; 1 to 140 characters.
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        financialDate:
          $ref: '#/components/schemas/FinancialDate'
        categoryId:
          type: string
          format: uuid
          description: A top-level category of the space whose kind equals type.
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
          description: Optional subcategory of categoryId.
        cardId:
          type: string
          format: uuid
          description: >
            Records a card purchase (expense only, active card of the space).
            Card purchases have no status of their own; do not send status.
        invoiceMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: >
            Invoice (reference month) for a card purchase, from the month
            before to two months after financialDate. Defaults to the
            invoice whose closing date is after financialDate.
        tagIds:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Active tags of the space; tags never change amounts (DR-013).
          items:
            type: string
            format: uuid
        installments:
          type: integer
          minimum: 2
          maximum: 48
          description: >
            Splits a card purchase into this many installments (amountMinor
            is the total; the remainder cents go to the first). Installment
            k is dated k - 1 months after financialDate and goes to the
            invoice k - 1 months after the first. The response is the first
            installment.
    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - description
        - amountMinor
        - currency
        - financialDate
        - category
        - subcategory
        - createdAt
        - version
        - deletedAt
        - recurrenceSeriesId
        - occurrenceDate
        - cardPurchase
        - installment
        - tags
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          description: ISO 4217 code. Currently always BRL.
          pattern: '^[A-Z]{3}$'
        financialDate:
          $ref: '#/components/schemas/FinancialDate'
        category:
          $ref: '#/components/schemas/CategoryReference'
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/CategoryReference'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Incremented on every effective edit; send it back when editing.
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the transaction was soft-deleted; null when active.
        recurrenceSeriesId:
          type:
            - string
            - 'null'
          format: uuid
          description: The series this transaction is an occurrence of; null for one-off entries.
        occurrenceDate:
          type:
            - string
            - 'null'
          format: date
          description: Scheduled (unadjusted) date of the occurrence; null for one-off entries.
        cardPurchase:
          description: >
            The card and invoice of a card purchase; null otherwise. A card
            purchase counts in the metrics of its invoice month (DR-035).
          oneOf:
            - $ref: '#/components/schemas/CardPurchase'
            - type: 'null'
        tags:
          type: array
          description: Tags of the transaction, by name.
          items:
            $ref: '#/components/schemas/CategoryReference'
        installment:
          description: Installment number and count of an installment purchase; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/Installment'
            - type: 'null'
    Change:
      type: object
      additionalProperties: false
      required:
