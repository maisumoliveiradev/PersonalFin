  /financial-spaces/{spaceId}/card-limits:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getCardLimits
      summary: Known used and available limit of every card on a date
      description: >
        usedMinor is the unpaid part of all invoices of the card (every
        non-deleted purchase, including future installments, minus
        payments). availableMinor = current limit on the date - usedMinor;
        it may be negative and is null when no limit is effective yet.
      parameters:
        - name: 'on'
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One entry per card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLimits'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '426':
          $ref: '#/components/responses/ClientUpgradeRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
