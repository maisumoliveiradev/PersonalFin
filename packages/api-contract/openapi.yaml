openapi: 3.1.0
info:
  title: PersonalFin Application API
  version: 0.3.0
  description: >
    Application API contract. Authentication endpoints (sign-up, sign-in,
    sign-out, session) are served by Better Auth under /api/auth and are
    consumed through the Better Auth client; they are not part of this
    contract (ADR-0007).
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API liveness
      security: []
      responses:
        '200':
          description: The API process is running and able to serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      responses:
        '200':
          description: The user bound to the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /financial-spaces:
    get:
      operationId: listFinancialSpaces
      summary: List the Financial Spaces the user can access
      responses:
        '200':
          description: Accessible Financial Spaces, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSpaceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: createFinancialSpace
      summary: Create a Financial Space owned by the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinancialSpaceRequest'
      responses:
        '201':
          description: The created Financial Space. The creator is its Owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSpace'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /financial-spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getFinancialSpace
      summary: Return one accessible Financial Space
      responses:
        '200':
          description: The Financial Space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSpace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/categories:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listCategories
      summary: List the categories of an accessible Financial Space
      description: >
        Top-level categories ordered by position, each with its
        subcategories, including archived ones (flagged). Every new space
        receives the default catalog once.
      responses:
        '200':
          description: The category tree of the space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: createCategory
      summary: Create a category, or a subcategory when parentCategoryId is set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: The created category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
        '422':
          description: The parent is not an active top-level category of the same kind (code PARENT_CATEGORY_NOT_AVAILABLE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCategory
      summary: Rename, archive, or unarchive a category (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: The category after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
    delete:
      operationId: deleteCategory
      summary: Permanently delete a never-used category without subcategories
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryConflict'
  /financial-spaces/{spaceId}/transactions:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listTransactions
      summary: List the most recent transactions of an accessible Financial Space
      description: >
        Ordered by financial date (newest first), then by creation time
        (newest first).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: state
          in: query
          required: false
          description: >
            active (default) lists non-deleted transactions by financial date;
            deleted lists the trash, most recently deleted first.
          schema:
            type: string
            enum:
              - active
              - deleted
            default: active
        - name: month
          in: query
          required: false
          description: Calendar month of the financial date (YYYY-MM).
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: categoryId
          in: query
          required: false
          description: Matches the category or the subcategory.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Case- and accent-insensitive search in the description.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous page's nextCursor.
          schema:
            type: string
      responses:
        '200':
          description: The most recent transactions of the space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: createTransaction
      summary: Register a manual income or expense in an accessible Financial Space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: The created transaction, recorded in the space currency (BRL).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '422':
          $ref: '#/components/responses/TransactionRejected'
  /financial-spaces/{spaceId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      summary: Return one transaction of an accessible Financial Space
      responses:
        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
    patch:
      operationId: updateTransaction
      summary: Edit a transaction (partial update with optimistic concurrency)
      description: >
        Only the fields present are changed. The final state must satisfy
        the same rules as creation. Every effective change is recorded in
        the audit log; a request that changes nothing is accepted without
        a new version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: The transaction after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/TransactionRejected'
    delete:
      operationId: deleteTransaction
      summary: Soft delete a transaction (restorable, audited)
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The deleted transaction (deletedAt set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /financial-spaces/{spaceId}/transactions/{transactionId}/restore:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/TransactionId'
    post:
      operationId: restoreTransaction
      summary: Restore a soft-deleted transaction (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: The restored transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TransactionNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /financial-spaces/{spaceId}/balance-snapshots:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listBalanceSnapshots
      summary: List observed balance snapshots, most recent first
      description: >
        Ordered by observed date, then recording instant (newest first).
        current is the first item: the latest observed consolidated balance.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Snapshot history of the space.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshotList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: recordBalanceSnapshot
      summary: Record an observed consolidated balance (append-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordBalanceSnapshotRequest'
      responses:
        '201':
          description: The recorded snapshot. Earlier snapshots are never changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSnapshot'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/balance-reminder:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getBalanceReminder
      summary: Return the user's balance reminder setting for the space
      description: Returns the default (every 7 days) with isDefault true when never saved.
      responses:
        '200':
          description: The effective setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceReminder'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    put:
      operationId: setBalanceReminder
      summary: Save the user's balance reminder setting for the space
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceReminderSetting'
      responses:
        '200':
          description: The saved setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceReminder'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getMonthlyDashboard
      summary: Built-in metrics of one month (see docs/product/METRICS.md)
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Metric values M-001 to M-007 for the month.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyDashboard'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/recurrences:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listRecurrences
      summary: List recurring series of the space
      responses:
        '200':
          description: Series, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeriesList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: createRecurrence
      summary: Create a recurring income or expense series
      description: >
        Creates the series and its Pending occurrences through the end of
        the month 12 months after the current month. Each occurrence is an
        ordinary transaction linked by recurrenceSeriesId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurrenceRequest'
      responses:
        '201':
          description: The series and how many occurrences were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeriesCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '422':
          $ref: '#/components/responses/CategoryNotAvailable'
  /financial-spaces/{spaceId}/recurrences/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/SeriesId'
    patch:
      operationId: updateRecurrenceFrom
      summary: Change the series defaults for this and following occurrences
      description: >
        Updates the series and every Pending, non-deleted occurrence on or
        after fromOccurrenceDate that was not individually modified. Paid,
        past-edited, and deleted occurrences are never rewritten. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurrenceRequest'
      responses:
        '200':
          description: The series after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeriesChanged'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RecurrenceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/CategoryNotAvailable'
  /financial-spaces/{spaceId}/recurrences/{seriesId}/end:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/SeriesId'
    post:
      operationId: endRecurrence
      summary: End a series on a date
      description: >
        Sets the end date and moves to the trash every Pending, unmodified
        occurrence scheduled after it. Everything else is kept. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - version
                - endDate
              properties:
                version:
                  type: integer
                  minimum: 1
                endDate:
                  $ref: '#/components/schemas/FinancialDate'
      responses:
        '200':
          description: The ended series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSeriesChanged'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RecurrenceNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /financial-spaces/{spaceId}/recurrences/materialize:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    post:
      operationId: materializeRecurrences
      summary: Create missing occurrences of every series through a month
      description: Idempotent. Never goes beyond 60 months after the current month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - throughMonth
              properties:
                throughMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Number of occurrences created by this call.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - occurrencesCreated
                properties:
                  occurrencesCreated:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/projection:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getProjectionSeries
      summary: Projected month-end balances (M-008) for consecutive months
      parameters:
        - name: fromMonth
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        '200':
          description: One projected month-end balance per month (null without an observed balance).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectionSeries'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/commitments:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getCommitments
      summary: Pending income and expenses that are overdue or coming up
      description: >
        overdue = Pending, non-deleted transactions dated before from;
        upcoming = those dated from `from` through from + days - 1. Items
        are ordered by financial date; each section returns at most 200
        items plus exact totals.
      parameters:
        - name: from
          in: query
          required: true
          description: The user's current calendar date.
          schema:
            type: string
            format: date
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
      responses:
        '200':
          description: Overdue and upcoming commitments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitments'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
  /financial-spaces/{spaceId}/cards:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listCards
      summary: List the credit cards of the space
      responses:
        '200':
          description: Active cards first, then archived, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
    post:
      operationId: createCard
      summary: Register a credit card with its initial limit
      description: Creates the card and the first entry of its limit history. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: The created card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/FinancialSpaceNotFound'
        '409':
          $ref: '#/components/responses/CardConflict'
  /financial-spaces/{spaceId}/cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getCard
      summary: Get a card with its limit history
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
    patch:
      operationId: updateCard
      summary: Rename, change closing/due days, or archive a card
      description: Version-checked and audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: The card after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          $ref: '#/components/responses/CardConflict'
  /financial-spaces/{spaceId}/cards/{cardId}/limit-changes:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
    post:
      operationId: recordCardLimit
      summary: Record a new card limit from an effective date
      description: >
        Appends to the limit history; earlier values are never changed
        (FR-051). The current limit on a date is the latest value effective
        on or before it (ties: latest recorded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCardLimitRequest'
      responses:
        '201':
          description: The card with its updated limit history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
  /financial-spaces/{spaceId}/cards/{cardId}/invoices/{month}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/InvoiceMonth'
    get:
      operationId: getCardInvoice
      summary: Get the invoice of a card for a reference month with its purchases
      responses:
        '200':
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInvoice'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
  /financial-spaces/{spaceId}/cards/{cardId}/invoices/{month}/dates:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/InvoiceMonth'
    put:
      operationId: setCardInvoiceDates
      summary: Override the closing and due dates of one invoice
      description: >
        Changes only this invoice (DR-038); the card defaults and the
        purchases already assigned to it are unchanged. Version-checked and
        audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDatesRequest'
      responses:
        '200':
          description: The invoice after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInvoice'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
  /financial-spaces/{spaceId}/installment-purchases/{purchaseId}/cancel:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - name: purchaseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelInstallments
      summary: Cancel the installments of a purchase after an invoice month
      description: >
        Moves to the trash the installments whose invoice month is after
        afterMonth. Earlier installments are kept (DR-043). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - afterMonth
              properties:
                afterMonth:
                  type: string
                  pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: How many installments were cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - cancelled
                properties:
                  cancelled:
                    type: integer
                    minimum: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: The purchase does not exist in this space (code INSTALLMENT_PURCHASE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/cards/{cardId}/invoices/{month}/payments:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/InvoiceMonth'
    post:
      operationId: payCardInvoice
      summary: Record a full or partial invoice payment
      description: >
        Settles already-recorded card expenses; it never creates an expense
        (DR-036). The amount cannot exceed the open amount (DR-039). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - amountMinor
                - paidOn
              properties:
                amountMinor:
                  $ref: '#/components/schemas/AmountMinor'
                paidOn:
                  $ref: '#/components/schemas/FinancialDate'
      responses:
        '201':
          description: The invoice after the payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInvoice'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/CardNotFound'
        '422':
          description: The invoice has no open amount this large (code PAYMENT_EXCEEDS_OUTSTANDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /financial-spaces/{spaceId}/cards/{cardId}/invoices/{month}/payments/{paymentId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/InvoiceMonth'
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeCardInvoicePayment
      summary: Remove an invoice payment recorded by mistake
      description: Soft-deletes the payment; audited.
      responses:
        '200':
          description: The invoice after the removal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInvoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CARD_NOT_FOUND or INVOICE_PAYMENT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    InvoiceMonth:
      name: month
      in: path
      required: true
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    CardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: personalfin.session_token
      description: >
        Session cookie issued by Better Auth. Native clients send the same
        cookie through the Cookie header.
  responses:
    TransactionRejected:
      description: >
        CATEGORY_NOT_AVAILABLE (category not usable for the type),
        CARD_NOT_AVAILABLE (missing or archived card), or
        INVALID_CARD_PURCHASE (income, status sent, invoice out of range, or
        invoice change on a non-card transaction).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardNotFound:
      description: The card does not exist in this space (code CARD_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CardConflict:
      description: VERSION_CONFLICT or CARD_NAME_TAKEN (another card of the space has the name).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RecurrenceNotFound:
      description: The series does not exist in this space (code RECURRENCE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotFound:
      description: The category does not exist in this space (code CATEGORY_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryConflict:
      description: >
        VERSION_CONFLICT, CATEGORY_NAME_TAKEN (sibling with the same name),
        CATEGORY_IN_USE (used by transactions, including deleted ones;
        archive instead), or CATEGORY_HAS_SUBCATEGORIES.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotAvailable:
      description: >
        The category is not a top-level category of this space with the
        same kind as the transaction type, or the subcategory does not
        belong to it (code CATEGORY_NOT_AVAILABLE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransactionNotFound:
      description: The transaction does not exist in this space (code TRANSACTION_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StateConflict:
      description: >
        The request conflicts with the record's current state: the version
        is outdated (VERSION_CONFLICT), the transaction is deleted and cannot
        be edited (TRANSACTION_DELETED), or it is already deleted / not
        deleted (TRANSACTION_ALREADY_DELETED, TRANSACTION_NOT_DELETED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: The request is invalid (code VALIDATION_FAILED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    FinancialSpaceNotFound:
      description: >
        The Financial Space does not exist or is not accessible to the user
        (code FINANCIAL_SPACE_NOT_FOUND). Both cases return 404 so that
        inaccessible spaces are not revealed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CardDay:
      type: integer
      minimum: 1
      maximum: 31
      description: Day of the month; months without it use their last day.
    CardName:
      type: string
      minLength: 1
      maxLength: 60
    CardLimitChange:
      type: object
      additionalProperties: false
      required:
        - id
        - amountMinor
        - currency
        - effectiveFrom
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
        recordedAt:
          type: string
          format: date-time
    Card:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - closingDay
        - dueDay
        - archived
        - version
        - limits
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        limits:
          type: array
          description: Limit history, latest effective date first (ties, latest recorded first).
          items:
            $ref: '#/components/schemas/CardLimitChange'
    CardList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Card'
    CreateCardRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - closingDay
        - dueDay
        - limitMinor
        - limitEffectiveFrom
      properties:
        name:
          $ref: '#/components/schemas/CardName'
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        limitMinor:
          $ref: '#/components/schemas/AmountMinor'
        limitEffectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
    UpdateCardRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
        name:
          $ref: '#/components/schemas/CardName'
        closingDay:
          $ref: '#/components/schemas/CardDay'
        dueDay:
          $ref: '#/components/schemas/CardDay'
        archived:
          type: boolean
    RecordCardLimitRequest:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - effectiveFrom
      properties:
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        effectiveFrom:
          $ref: '#/components/schemas/FinancialDate'
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    CreateFinancialSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          description: Trimmed, internal whitespace collapsed; 1 to 80 characters.
          minLength: 1
          maxLength: 80
    FinancialSpace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - lifecycleState
        - role
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        lifecycleState:
          type: string
          enum:
            - active
        role:
          type: string
          description: The requesting user's role in the space.
          enum:
            - owner
        createdAt:
          type: string
          format: date-time
    FinancialSpaceList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinancialSpace'
    CategoryKind:
      type: string
      description: Transaction type a category applies to.
      enum:
        - expense
        - income
    Subcategory:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - archived
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
    CategoryTreeItem:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - archived
        - version
        - subcategories
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        archived:
          type: boolean
          description: Archived categories are kept on existing transactions but not offered for new ones.
        version:
          type: integer
          minimum: 1
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
    Category:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - parentCategoryId
        - archived
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        parentCategoryId:
          type:
            - string
            - 'null'
          format: uuid
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          allOf:
            - $ref: '#/components/schemas/CategoryKind'
          description: Required for top-level categories; subcategories inherit the parent kind.
        parentCategoryId:
          type:
            - string
            - 'null'
          format: uuid
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 60
        archived:
          type: boolean
    CategoryList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTreeItem'
    TransactionType:
      type: string
      enum:
        - expense
        - income
    TransactionStatus:
      type: string
      description: paid means Paid (expense) or Received (income).
      enum:
        - paid
        - pending
    AmountMinor:
      type: integer
      description: >
        Amount in the currency's minor units (for BRL, centavos). Always
        positive; the transaction type carries the direction.
      minimum: 1
      maximum: 99999999999
    FinancialDate:
      type: string
      format: date
      description: Calendar date without time or timezone (YYYY-MM-DD).
    CategoryReference:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - description
        - amountMinor
        - financialDate
        - categoryId
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          allOf:
            - $ref: '#/components/schemas/TransactionStatus'
          description: Defaults to paid.
        description:
          type: string
          description: Trimmed, internal whitespace collapsed; 1 to 140 characters.
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        financialDate:
          $ref: '#/components/schemas/FinancialDate'
        categoryId:
          type: string
          format: uuid
          description: A top-level category of the space whose kind equals type.
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
          description: Optional subcategory of categoryId.
        cardId:
          type: string
          format: uuid
          description: >
            Records a card purchase (expense only, active card of the space).
            Card purchases have no status of their own; do not send status.
        invoiceMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: >
            Invoice (reference month) for a card purchase, from the month
            before to two months after financialDate. Defaults to the
            invoice whose closing date is after financialDate.
        installments:
          type: integer
          minimum: 2
          maximum: 48
          description: >
            Splits a card purchase into this many installments (amountMinor
            is the total; the remainder cents go to the first). Installment
            k is dated k - 1 months after financialDate and goes to the
            invoice k - 1 months after the first. The response is the first
            installment.
    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - status
        - description
        - amountMinor
        - currency
        - financialDate
        - category
        - subcategory
        - createdAt
        - version
        - deletedAt
        - recurrenceSeriesId
        - occurrenceDate
        - cardPurchase
        - installment
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          description: ISO 4217 code. Currently always BRL.
          pattern: '^[A-Z]{3}$'
        financialDate:
          $ref: '#/components/schemas/FinancialDate'
        category:
          $ref: '#/components/schemas/CategoryReference'
        subcategory:
          oneOf:
            - $ref: '#/components/schemas/CategoryReference'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Incremented on every effective edit; send it back when editing.
        deletedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the transaction was soft-deleted; null when active.
        recurrenceSeriesId:
          type:
            - string
            - 'null'
          format: uuid
          description: The series this transaction is an occurrence of; null for one-off entries.
        occurrenceDate:
          type:
            - string
            - 'null'
          format: date
          description: Scheduled (unadjusted) date of the occurrence; null for one-off entries.
        cardPurchase:
          description: >
            The card and invoice of a card purchase; null otherwise. A card
            purchase counts in the metrics of its invoice month (DR-035).
          oneOf:
            - $ref: '#/components/schemas/CardPurchase'
            - type: 'null'
        installment:
          description: Installment number and count of an installment purchase; null otherwise.
          oneOf:
            - $ref: '#/components/schemas/Installment'
            - type: 'null'
    Installment:
      type: object
      additionalProperties: false
      required:
        - purchaseId
        - number
        - count
      properties:
        purchaseId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 2
    CardPurchase:
      type: object
      additionalProperties: false
      required:
        - cardId
        - cardName
        - invoiceMonth
        - invoiceSettled
      properties:
        cardId:
          type: string
          format: uuid
        cardName:
          type: string
        invoiceMonth:
          type: string
        invoiceSettled:
          type: boolean
          description: True when the invoice is fully paid; the purchase then counts as realized.
    CardInvoice:
      type: object
      additionalProperties: false
      description: >
        An invoice of a card for a reference month (the month of its due
        date). Before any purchase or date change it does not exist yet:
        version is null and the dates are the card defaults.
      required:
        - cardId
        - referenceMonth
        - closingDate
        - dueDate
        - totalMinor
        - paidMinor
        - outstandingMinor
        - state
        - payments
        - version
        - purchases
        - hasMore
      properties:
        cardId:
          type: string
          format: uuid
        referenceMonth:
          type: string
        closingDate:
          $ref: '#/components/schemas/FinancialDate'
        dueDate:
          $ref: '#/components/schemas/FinancialDate'
        totalMinor:
          type: integer
          minimum: 0
          description: Sum of the non-deleted purchases of the invoice.
        paidMinor:
          type: integer
          minimum: 0
          description: Sum of the payments of the invoice (never expenses, DR-036).
        outstandingMinor:
          type: integer
          description: totalMinor - paidMinor; negative when purchases were removed after payment.
        state:
          type: string
          enum:
            - empty
            - open
            - partially_paid
            - paid
        payments:
          type: array
          items:
            $ref: '#/components/schemas/InvoicePayment'
        version:
          type:
            - integer
            - 'null'
          minimum: 1
        purchases:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        hasMore:
          type: boolean
    InvoicePayment:
      type: object
      additionalProperties: false
      required:
        - id
        - amountMinor
        - paidOn
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        paidOn:
          $ref: '#/components/schemas/FinancialDate'
        recordedAt:
          type: string
          format: date-time
    InvoiceDatesRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - closingDate
        - dueDate
      properties:
        version:
          description: The invoice version, or null when it does not exist yet.
          type:
            - integer
            - 'null'
          minimum: 1
        closingDate:
          $ref: '#/components/schemas/FinancialDate'
        dueDate:
          $ref: '#/components/schemas/FinancialDate'
    CommitmentInvoice:
      type: object
      additionalProperties: false
      required:
        - cardId
        - cardName
        - referenceMonth
        - dueDate
        - amountMinor
      properties:
        cardId:
          type: string
          format: uuid
        cardName:
          type: string
        referenceMonth:
          type: string
        dueDate:
          $ref: '#/components/schemas/FinancialDate'
        amountMinor:
          type: integer
          description: Open amount of the invoice.
    VersionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
    UpdateTransactionRequest:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          minimum: 1
          description: The version the client edited.
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        description:
          type: string
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        financialDate:
          $ref: '#/components/schemas/FinancialDate'
        categoryId:
          type: string
          format: uuid
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
        invoiceMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Moves a card purchase to another invoice of the same card.
    TransactionList:
      type: object
      additionalProperties: false
      required:
        - items
        - hasMore
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        hasMore:
          type: boolean
          description: True when more transactions match beyond this page.
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass as cursor to fetch the next page; null on the last page.
    RecordBalanceSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - amountMinor
        - observedOn
      properties:
        amountMinor:
          type: integer
          minimum: -99999999999
          maximum: 99999999999
          description: Observed balance in minor units; may be zero or negative.
        observedOn:
          $ref: '#/components/schemas/FinancialDate'
        note:
          type:
            - string
            - 'null'
          maxLength: 140
    BalanceSnapshot:
      type: object
      additionalProperties: false
      required:
        - id
        - amountMinor
        - currency
        - observedOn
        - note
        - recordedAt
      properties:
        id:
          type: string
          format: uuid
        amountMinor:
          type: integer
          minimum: -99999999999
          maximum: 99999999999
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        observedOn:
          $ref: '#/components/schemas/FinancialDate'
        note:
          type:
            - string
            - 'null'
        recordedAt:
          type: string
          format: date-time
    BalanceSnapshotList:
      type: object
      additionalProperties: false
      required:
        - items
        - current
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceSnapshot'
        current:
          oneOf:
            - $ref: '#/components/schemas/BalanceSnapshot'
            - type: 'null'
        hasMore:
          type: boolean
    BalanceReminderFrequency:
      type: string
      enum:
        - app_start
        - daily
        - every_n_days
        - never
    BalanceReminderSetting:
      type: object
      additionalProperties: false
      required:
        - frequency
        - intervalDays
      properties:
        frequency:
          $ref: '#/components/schemas/BalanceReminderFrequency'
        intervalDays:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 90
          description: Required (1 to 90) for every_n_days; null otherwise.
    BalanceReminder:
      type: object
      additionalProperties: false
      required:
        - frequency
        - intervalDays
        - isDefault
      properties:
        frequency:
          $ref: '#/components/schemas/BalanceReminderFrequency'
        intervalDays:
          type:
            - integer
            - 'null'
        isDefault:
          type: boolean
    MonthlyDashboard:
      type: object
      additionalProperties: false
      required:
        - month
        - currency
        - realizedIncome
        - realizedExpenses
        - realizedNet
        - forecastIncome
        - forecastExpenses
        - realizedExpensesByCategory
        - observedBalance
        - projection
      properties:
        month:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        realizedIncome:
          type: integer
          description: M-001, minor units.
        realizedExpenses:
          type: integer
          description: M-002, minor units.
        realizedNet:
          type: integer
          description: M-003 = M-001 - M-002; may be negative.
        forecastIncome:
          type: integer
          description: M-004, minor units.
        forecastExpenses:
          type: integer
          description: M-005, minor units.
        realizedExpensesByCategory:
          type: array
          description: M-006, sorted by amount (desc), then name.
          items:
            type: object
            additionalProperties: false
            required:
              - categoryId
              - name
              - amountMinor
            properties:
              categoryId:
                type: string
                format: uuid
              name:
                type: string
              amountMinor:
                type: integer
        observedBalance:
          description: M-007, the latest observed balance dated within or before the month.
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - amountMinor
                - observedOn
              properties:
                amountMinor:
                  type: integer
                observedOn:
                  $ref: '#/components/schemas/FinancialDate'
            - type: 'null'
        projection:
          description: M-008 projected month-end balance; null without an observed balance.
          oneOf:
            - $ref: '#/components/schemas/Projection'
            - type: 'null'
    RecurrenceFrequency:
      type: string
      enum:
        - monthly
        - weekly
        - yearly
    NonBusinessDayRule:
      type: string
      description: What to do when an occurrence falls on a non-business day.
      enum:
        - keep
        - previous
        - next
    CreateRecurrenceRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - description
        - amountMinor
        - categoryId
        - frequency
        - nonBusinessDayRule
        - startDate
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        description:
          type: string
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        categoryId:
          type: string
          format: uuid
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
        frequency:
          $ref: '#/components/schemas/RecurrenceFrequency'
        nonBusinessDayRule:
          $ref: '#/components/schemas/NonBusinessDayRule'
        startDate:
          $ref: '#/components/schemas/FinancialDate'
        endDate:
          type:
            - string
            - 'null'
          format: date
    RecurrenceSeries:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - description
        - amountMinor
        - currency
        - categoryId
        - subcategoryId
        - frequency
        - nonBusinessDayRule
        - startDate
        - endDate
        - materializedThrough
        - version
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        description:
          type: string
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        categoryId:
          type: string
          format: uuid
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
        frequency:
          $ref: '#/components/schemas/RecurrenceFrequency'
        nonBusinessDayRule:
          $ref: '#/components/schemas/NonBusinessDayRule'
        startDate:
          $ref: '#/components/schemas/FinancialDate'
        endDate:
          type:
            - string
            - 'null'
          format: date
        materializedThrough:
          type:
            - string
            - 'null'
          format: date
        version:
          type: integer
          minimum: 1
    RecurrenceSeriesCreated:
      type: object
      additionalProperties: false
      required:
        - series
        - occurrencesCreated
      properties:
        series:
          $ref: '#/components/schemas/RecurrenceSeries'
        occurrencesCreated:
          type: integer
          minimum: 0
    UpdateRecurrenceRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - fromOccurrenceDate
      properties:
        version:
          type: integer
          minimum: 1
        fromOccurrenceDate:
          $ref: '#/components/schemas/FinancialDate'
        description:
          type: string
          minLength: 1
          maxLength: 140
        amountMinor:
          $ref: '#/components/schemas/AmountMinor'
        categoryId:
          type: string
          format: uuid
        subcategoryId:
          type:
            - string
            - 'null'
          format: uuid
    RecurrenceSeriesChanged:
      type: object
      additionalProperties: false
      required:
        - series
        - occurrencesAffected
      properties:
        series:
          $ref: '#/components/schemas/RecurrenceSeries'
        occurrencesAffected:
          type: integer
          minimum: 0
    RecurrenceSeriesList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecurrenceSeries'
    FlowTotals:
      type: object
      additionalProperties: false
      required:
        - income
        - expenses
      properties:
        income:
          type: integer
        expenses:
          type: integer
    Projection:
      type: object
      additionalProperties: false
      description: >
        M-008. amountMinor = base.amountMinor + (afterObservation.income -
        afterObservation.expenses) + (pendingUpToObservation.income -
        pendingUpToObservation.expenses) - openInvoices - invoicePayments.
        Card purchases enter only through their invoices. A calculation, never an observed
        balance.
      required:
        - amountMinor
        - base
        - afterObservation
        - pendingUpToObservation
        - openInvoices
        - invoicePayments
      properties:
        amountMinor:
          type: integer
        base:
          type: object
          additionalProperties: false
          required:
            - amountMinor
            - observedOn
          properties:
            amountMinor:
              type: integer
            observedOn:
              $ref: '#/components/schemas/FinancialDate'
        afterObservation:
          $ref: '#/components/schemas/FlowTotals'
        pendingUpToObservation:
          $ref: '#/components/schemas/FlowTotals'
        openInvoices:
          type: integer
          description: >
            Amount of card invoices due before the end of the month not
            covered by payments dated before the end of the month.
        invoicePayments:
          type: integer
          description: Invoice payments dated after the observation and before the end of the month.
    ProjectionSeries:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - month
              - projectedBalance
            properties:
              month:
                type: string
              projectedBalance:
                type:
                  - integer
                  - 'null'
    CommitmentSection:
      type: object
      additionalProperties: false
      required:
        - items
        - invoices
        - hasMore
        - income
        - expenses
      properties:
        items:
          type: array
          description: Pending transactions other than card purchases.
          items:
            $ref: '#/components/schemas/Transaction'
        invoices:
          type: array
          description: Open card invoices due in the section, by due date.
          items:
            $ref: '#/components/schemas/CommitmentInvoice'
        hasMore:
          type: boolean
        income:
          type: integer
          description: Sum of pending income in the section, minor units.
        expenses:
          type: integer
          description: Sum of pending expenses and open invoices in the section, minor units.
    Commitments:
      type: object
      additionalProperties: false
      required:
        - from
        - through
        - overdue
        - upcoming
      properties:
        from:
          $ref: '#/components/schemas/FinancialDate'
        through:
          $ref: '#/components/schemas/FinancialDate'
        overdue:
          $ref: '#/components/schemas/CommitmentSection'
        upcoming:
          $ref: '#/components/schemas/CommitmentSection'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable description; not localized.
