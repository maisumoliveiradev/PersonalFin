openapi: 3.1.0
info:
  title: PersonalFin Application API
  version: 0.1.0
  description: >
    Application API contract. Authentication endpoints (sign-up, sign-in,
    sign-out, session) are served by Better Auth under /api/auth and are
    consumed through the Better Auth client; they are not part of this
    contract (ADR-0007).
security:
  - sessionCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API liveness
      security: []
      responses:
        '200':
          description: The API process is running and able to serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user
      responses:
        '200':
          description: The user bound to the current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: personalfin.session_token
      description: >
        Session cookie issued by Better Auth. Native clients send the same
        cookie through the Cookie header.
  responses:
    Unauthenticated:
      description: No valid session was provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable description; not localized.
